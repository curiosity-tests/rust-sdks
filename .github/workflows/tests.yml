name: Tests

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    # Skip the test matrix for changes that can't possibly affect Rust
    # compilation/tests (docs, changesets, license/notice, dependabot config).
    # Source-only changes still trigger normally.
    paths-ignore:
    - "**/*.md"
    - ".changeset/**"
    - "LICENSE"
    - "NOTICE"
    - "renovate.json"
    - ".vscode/**"

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  CARGO_TERM_COLOR: always
  RUST_LOG: debug
  # sccache stores its cache in GitHub Actions' cache backend; both rustc and
  # C/C++ invocations route through it. RUSTC_WRAPPER is intentionally NOT set
  # at workflow scope — the "Enable sccache" step only exports it after the
  # backend probe succeeds, so transient outages of the GHA cache service
  # (which return HTTP 400 and abort sccache server startup) make CI continue
  # without sccache instead of failing the whole build.
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read
  id-token: write

run-name: "Tests ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Platform supports is limited for tests
        - os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        submodules: true
    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6   # v1.16.1
      with:
        target: ${{ matrix.target }}
        cache: false
        rustflags: ""

    - name: Install Protoc
      uses: arduino/setup-protoc@a8b67ba40b37d35169e222f3bb352603327985b6   # v2.1.0
      with:
        version: "25.2"
        repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Ubuntu 24 ships clang 18; webrtc-sys needs 21+ for libwebrtc's hermetic
      # libc++. Must run before the sccache step, which wraps whatever CC/CXX
      # this sets. (The previous default here was the host `cc`/`c++`, i.e. GCC,
      # which webrtc-sys/build.rs now rejects outright: GCC silently ignores
      # libc++'s trivial_abi annotations and miscompiles unique_ptr returns.)
    - name: Install clang for webrtc-sys
      if: ${{ runner.os == 'Linux' }}
      run: .github/scripts/install-clang.sh

      # sccache wraps both rustc and the C/C++ compilers used by `cxx_build`
      # in `webrtc-sys`. The Mozilla action installs the binary; the probe
      # step below only enables wrapping if the GHA cache backend is reachable
      # (it occasionally returns transient HTTP 400s that crash sccache
      # startup — we want builds to continue, not fail, in that case).
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696   # v0.0.10

    - name: Enable sccache wrapping (probe first)
      shell: bash
      run: |
        # `sccache --start-server` actually exercises the configured backend
        # (here: GHA cache). If it fails — e.g. azure-side outage — log a
        # warning and skip exporting RUSTC_WRAPPER / CC / CXX so the build
        # falls back to vanilla rustc. Slower, but green.
        if sccache --start-server >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          # All three matrix targets in tests.yml are host targets (no
          # cross-compile), so wrapping CC/CXX is safe. Skip on Windows:
          # MSVC `cl` setup needs more care.
          # On Linux CC/CXX already point at the clang installed above; keep
          # that compiler and just prepend the wrapper.
          if [ "${{ runner.os }}" != "Windows" ]; then
            echo "CC=sccache ${CC:-cc}"   >> "$GITHUB_ENV"
            echo "CXX=sccache ${CXX:-c++}" >> "$GITHUB_ENV"
          fi
          echo "::notice::sccache enabled (RUSTC_WRAPPER=sccache)"
        else
          echo "::warning::sccache backend unreachable; building without compile cache this run"
        fi

      # Cache cargo's downloaded crate sources + per-target build outputs.
    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo target
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
      with:
        path: target/
        key: ${{ runner.os }}-cargo-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-target-${{ matrix.target }}-

    - name: Install linux dependencies
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        sudo apt update -y
        # libasound2-dev is needed for local_audio example
        # libdrm, libgbm, libxfixes, libxdamage, libxrandr, libxcomposite and libglib are needed for DesktopCapturer
        sudo apt install -y \
          libasound2-dev \
          libssl-dev \
          libx11-dev \
          libgl1-mesa-dev \
          libxext-dev \
          libva-dev \
          libdrm-dev \
          libnvidia-decode-570 \
          libnvidia-compute-570 \
          nvidia-cuda-dev \
          libgbm-dev \
          libxfixes-dev \
          libxdamage-dev \
          libxrandr-dev \
          libxcomposite-dev \
          libglib2.0-dev

    - name: Run LiveKit dev server
      uses: livekit/dev-server-action@61e2b4dcb170dd3591e0c9b0db3c3fe5db93b500
      with:
        github-token: ${{ github.token }}
        config: |
          # TODO: Remove once this is enabled by default.
          enable_participant_data_blob: true
    - name: Test
      env:
        RUST_LOG: info
      shell: bash
      run: |
        cargo test --verbose \
          --target ${{ matrix.target }} \
          --features __lk-e2e-test \
          -- \
          --nocapture \
          --test-threads=1

    - name: Test transport seam (livekit-net / livekit-signaling)
      shell: bash
      run: |
        cargo test --verbose --target ${{ matrix.target }} -p livekit-net --features native
        cargo test --verbose --target ${{ matrix.target }} -p livekit-signaling --features native

    - name: Build livekit-net uniffi feature (foreign transport bindings)
      shell: bash
      run: |
        cargo build --verbose --target ${{ matrix.target }} -p livekit-net --features uniffi
        cargo build --verbose --target ${{ matrix.target }} -p livekit-net --features uniffi,native
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
